:root{--bg:#f3f7f5;--surface:#fff;--fg:#1d2a26;--muted:#6a6d71;--line:#d5e0db;--green:#00905e;--yellow:#ffde0e;--blue:#00587B;--bad:#b3261e;--bad-soft:#fbe3e1;--ok-soft:#dcf1e6;--skip:#8a5a00;--skip-soft:#fff3d6;
--display:"Nunito","Trebuchet MS",Arial,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--surface:#172420;--fg:#e8f0ec;--muted:#a9b4b0;--line:#2a3a35;--green:#3fc08f;--blue:#81b8da;--bad:#ff8a80;--bad-soft:#3d1a18;--ok-soft:#173a2b;--skip:#f0b44c;--skip-soft:#3a2c10;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding:16px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{border-bottom:5px solid var(--yellow);padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo img{height:56px;width:auto;background:#fff;border-radius:8px;padding:4px}
h1{font:900 1.5rem/1.2 var(--display);color:var(--blue);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.photo img{display:block;width:100%;height:auto;border-radius:10px}
.muted{color:var(--muted);font-size:.92rem}
#st{margin-top:12px}
.note p{margin:0 0 10px}
.note.ok{background:var(--ok-soft);border-radius:10px;padding:12px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{font:700 1rem var(--body);min-height:52px;border-radius:12px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);padding:10px 14px;cursor:pointer}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.6}
.warn{color:var(--bad);font-weight:700}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}

<script src="config.js"></script>
<script>
(async()=>{
  const m=document.getElementById("main"), key=decodeURIComponent((location.hash||"").slice(1));
  const msg=t=>{ m.textContent=t };
  if(!/^[A-Za-z0-9_-]{32,}$/.test(key)) return msg("This link isn't complete. Please open it straight from the email, or reply to the email and we'll help.");
  let sb;
  try{ const cfg=window.TREERUN_CONFIG; sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:false}}) }catch(e){ return msg("We couldn't load the photo just now. Please try again in a few minutes.") }
  const fmt=(d,o)=>new Date(d).toLocaleString("en-GB",o).replace(/[<>&]/g,"");
  const P=t=>{ const e=document.createElement("p"); e.textContent=t; return e };
  function stateBox(st,data){
    const box=document.getElementById("st"); box.innerHTML="";
    const until=data.cutoff?fmt(data.cutoff,{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}):"";
    if(st==="ready"){ box.className="note ok"; box.append(P("Thank you. Your tree is back on our list and a team will call again before the end of Sunday 10 January."),P("Please leave it somewhere our volunteers can see it from the road, for example at the front of the house or by the drive.")); return }
    if(st==="not_needed"){ box.className="note"; box.append(P("Thank you for letting us know. We won't call again for this tree.")); return }
    if(st==="rebooked"){ box.className="note ok"; box.append(P("Your collection is already back on our list. Please leave the tree where it can be seen from the road.")); return }
    if(st==="closed"){ box.className="note"; box.append(P("This collection has been closed. If you have a question, please reply to the email we sent you.")); return }
    if(!data.can_reply){ box.className="note"; box.append(P("It's now too late to rebook online. If you have a question, please reply to the email we sent you.")); return }
    box.className="note";
    box.append(P("Please let us know what you'd like us to do"+(until?" (by "+until+")":"")+":"));
    const row=document.createElement("div"); row.className="btns";
    const b1=document.createElement("button"); b1.className="btn go"; b1.textContent="My tree is out now: please collect it";
    const b2=document.createElement("button"); b2.className="btn"; b2.textContent="Collection no longer needed";
    row.append(b1,b2); box.append(row);
    const ask=(choice,text)=>{
      box.innerHTML=""; box.append(P(text));
      const r=document.createElement("div"); r.className="btns";
      const yes=document.createElement("button"); yes.className="btn go"; yes.textContent="Yes, confirm";
      const no=document.createElement("button"); no.className="btn"; no.textContent="Go back";
      r.append(yes,no); box.append(r);
      no.onclick=()=>stateBox("missed",data);
      yes.onclick=async()=>{ yes.disabled=no.disabled=true; yes.textContent="Saving…";
        try{ const {data:res,error}=await sb.rpc("customer_respond",{p_key:key,p_choice:choice});
          if(error) throw error;
          if(res.ok) return stateBox(res.state,data);
          if(res.error==="too_late") return stateBox("missed",{...data,can_reply:false});
          if(res.error==="already") return location.reload();
          throw new Error(res.error) }
        catch(e){ yes.disabled=no.disabled=false; yes.textContent="Yes, confirm"; const w=P("That didn't save. Please check your connection and try again."); w.className="warn"; box.append(w) } };
    };
    b1.onclick=()=>ask("ready","We'll put your tree back on our list for one more visit before the end of Sunday 10 January. Please make sure it's out where our volunteers can see it from the road.");
    b2.onclick=()=>ask("not_needed","We'll take your address off our list and won't call again for this tree.");
  }
  try{
    const {data,error}=await sb.rpc("customer_photo",{p_key:key});
    if(error) return msg("We couldn't load the photo just now. Please try again in a few minutes.");
    if(data.error==="collected") return msg("Good news: your tree has now been collected, so this photo is no longer available. Thank you for supporting Primrose Hospice.");
    if(data.error) return msg("This photo is no longer available. If you have a question, please reply to the email.");
    if(!/^data:image[/](jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data.img||"")) return msg("This photo is no longer available.");
    const when=fmt(data.taken_at,{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
    m.innerHTML='<p style="margin-top:0">Our volunteers took this photo when they called to collect your tree and couldn&#39;t find it.</p><div class="photo"><img alt="Photo taken by our collection team"></div><p class="muted">Taken '+when+'.</p><div id="st"></div>';
    m.querySelector("img").src=data.img;
    stateBox(data.state,data);
  }catch(e){ msg("We couldn't load the photo just now. Please try again in a few minutes.") }
})();
</script>
</body></html>
