<style>

.q1{font:900 1.12rem/1.25 var(--display);overflow-wrap:anywhere}.ad1{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}.in1{font-size:1.05rem;font-weight:600}

.box{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}

button:disabled{opacity:.6}

.home{display:flex;flex-direction:column;gap:12px}
.bigbtn{font:900 1.25rem var(--display);padding:20px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.prog .pt{font:800 .8rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.prog .pb{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.prog .pb i{display:block;height:100%;background:var(--green);border-radius:7px}.prog .pn{display:flex;justify-content:space-between;font-size:1.05rem}.prog .pn b{font-size:1.3rem}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:900 1.6rem var(--display);color:var(--blue)}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:700}
.full{font:900 1.05rem var(--display);padding:16px;border-radius:14px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);cursor:pointer;width:100%}
.pcin{flex:1 1 140px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-transform:uppercase}
.thanks{background:var(--yellow);color:#1d2a26;border-radius:18px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.thanks h2{font:900 2rem/1.1 var(--display);margin:0;color:#00587B}
.thanks .bigno{font:900 4rem/1 var(--display);color:#00905e}
.thanks .tl{font-weight:700;font-size:1.05rem}
.endp{background:var(--surface);border:2px solid var(--blue);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.endp h2{font:900 1.3rem var(--display);margin:0;color:var(--blue)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.camlab{display:block;position:relative;overflow:hidden}.camlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
</style></head><body>
<div class="wrap">
  <header><div class="logo"><img id="logo" alt="Primrose Hospice" src="data:," style="min-width:110px"></div>
  <h1 id="title">Christmas Tree Collection</h1><div class="sub" id="sub">Loading…</div></header>
  <div id="main"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const cfg=window.TREERUN_CONFIG, sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:false}});
const DEPOT="19-21 Sherwood Road, Bromsgrove B60 3DR", DEPOT_LL={lat:52.31926,lon:-2.05864};
const teamToken=(location.hash||"").replace(/^#/,"").trim();
window.addEventListener("hashchange",()=>location.reload());
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=a=>String(a||"").replace(/, Worcestershire$/,"");
let data=null, busy=false, token="", geoOK=false, lastPos=null, view="home", pend=null;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
fetch("driver.html").then(r=>r.text()).then(t=>{const m=t.match(/<img src="(data:image\/png;base64,[^"]+)"/); if(m) $("#logo").src=m[1]}).catch(()=>{});
function skipWhy(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Why are you skipping ${esc(s.name)}?</h2><div class="sub">It goes back on the to-do list for another team.</div>
   <button class="btn" data-w="Van full">Van full</button><button class="btn" data-w="Tree too big">Tree too big</button>
   <div class="bar"><input id="why-other" type="text" maxlength="100" placeholder="Other reason"><button class="btn" data-w="Other" style="width:auto">Other</button></div>
   <button class="btn ghost" data-w="">Cancel</button></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-w]"); if(!x&&e.target!==m) return; let w=x?x.dataset.w:""; if(w==="Other"){const t=m.querySelector("#why-other").value.trim(); w=t?"Other: "+t:"Other"} m.remove(); res(w||null)}); document.body.appendChild(m)})}
function ask(title,text,ok){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div>${esc(text)}</div><div class="bar"><button class="btn ghost" data-x="0">Cancel</button><button class="btn" data-x="1" style="background:var(--blue);border-color:var(--blue)">${esc(ok)}</button></div></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-x]"); if(!x&&e.target!==m) return; m.remove(); res(x?.dataset.x==="1")}); document.body.appendChild(m)})}
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);let out=c.toDataURL("image/jpeg",q);for(let qq=q-.1;out.length>650000&&qq>.2;qq-=.1) out=c.toDataURL("image/jpeg",qq);res(out)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"))};i.src=u})}
function photoStep(s,kind){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${kind==="toobig"?"Take a photo of the tree":kind==="cf"?"Add a photo (optional)":"Take a photo of the house"}</h2><div class="sub">${kind==="toobig"?"So the office can see how big it is.":kind==="cf"?"Of the street or where you looked, so the office can see.":"Front of the house or the drive, showing there's no tree out."}</div>
   <label class="btn camlab">Take photo<input type="file" accept="image/*" capture="environment"></label><div class="sub" data-st hidden>Uploading photo…</div>
   <button class="btn ghost" data-np>${kind==="cf"?"Skip":"No photo"}</button></div>`;
  const fin=async img=>{ m.querySelectorAll("button,input").forEach(x=>x.disabled=true);
    let thumb=null; if(img){ m.querySelector("[data-st]").hidden=false; try{ thumb=await shrink(img,240,.6); img=await shrink(img,1280,.6) }catch(e){ toast("Couldn't read that photo. Try again."); m.querySelectorAll("button,input").forEach(x=>x.disabled=false); m.querySelector("[data-st]").hidden=true; return } }
    const {data:r,error}=await sb.rpc("driver_photo",{p_token:token,p_ref:s.ref,p_kind:kind==="cf"?"missed":kind,p_img:img,p_thumb:thumb});
    if(img&&(error||r?.error)){ toast(error?"Photo didn't send. Check signal. You can tap Add photo later.":"Couldn't save the photo."); m.remove(); return res(false) }
    m.remove(); if(img){ s.photo=true; toast("Photo added") } res(!!img) };
  m.querySelector("input").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0]; if(f) fin(f)});
  m.querySelector("[data-np]").addEventListener("click",()=>fin(null));
  document.body.appendChild(m)})}
function treesAsk(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal"; const b0=s.booked||s.trees||1;
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Collected + Extra</h2><div class="sub">${esc(s.name)}: booked ${b0} tree${b0===1?"":"s"}. How many extra trees are you taking?</div>
   <div class="num"><button data-d="-1" aria-label="One fewer">−</button><input id="tq" type="number" inputmode="numeric" min="1" max="29" value="1"><button data-d="1" aria-label="One more">+</button></div>
   <div class="sub" id="tqt" style="text-align:center"></div>
   <button class="btn" data-ok>Next</button><button class="btn ghost" data-x>Cancel</button></div>`;
  const inp=m.querySelector("#tq"), tot=()=>{const v=parseInt(inp.value,10)||0; m.querySelector("#tqt").innerHTML=`Total collected here: <b>${b0+v}</b>`}; tot(); inp.addEventListener("input",tot);
  m.addEventListener("click",e=>{const d=e.target.closest("[data-d]"); if(d){inp.value=Math.min(29,Math.max(1,(parseInt(inp.value,10)||1)+(+d.dataset.d)));tot();return}
    if(e.target.closest("[data-ok]")){const v=parseInt(inp.value,10); if(!(v>=1&&v<=29)){inp.focus();return} m.remove(); return res(b0+v)}
    if(e.target.closest("[data-x]")){m.remove(); res(null)} }); document.body.appendChild(m)})}
function confirmAct(s,v,why){return new Promise(res=>{const m=document.createElement("div");m.className="modal"; const b0=s.booked||s.trees||1, cf=why==="Can't find address";
  const t=v==="Collected"?"Confirm collected":v==="out"?"Undo this stop?":cf?"Can't find the address":"Confirm not collected";
  const line=v==="Collected"?`Booked: <b>${b0}</b> tree${b0===1?"":"s"}. Any extra trees here?</div>
   <div class="num"><button data-d="-1" aria-label="One fewer">−</button><input id="tq" type="number" inputmode="numeric" min="0" max="29" value="0"><button data-d="1" aria-label="One more">+</button></div>
   <div class="sub" id="tqt" style="text-align:center;font-size:1rem">`:v==="Missed"?(cf?"Reason: <b>Can't find the address</b>. The office will check the address and contact the customer.":"Reason: <b>No tree out</b>. You'll be asked for a photo next."):v==="Skipped"?(why==="Van full"?"Reason: <b>Van full</b>. This one and any stops left on your run go back on the list for other teams. Then head back to the depot to unload.":`Reason: <b>${esc(why||"")}</b>. It goes back on the list for another team.`):"It goes back to not done.";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${t}</h2><div><b>${esc(s.name)}</b><br>${esc(short(s.address))}, ${esc(s.postcode)}</div><div class="sub" style="font-size:1rem">${line}</div>
   <button class="btn" data-ok>Confirm</button><button class="btn ghost" data-x>Cancel</button></div>`;
  const inp=m.querySelector("#tq"), tot=()=>{ if(!inp) return; const n=parseInt(inp.value,10)||0; m.querySelector("#tqt").innerHTML=`Total collected here: <b>${b0+n}</b> tree${b0+n===1?"":"s"}`}; tot(); inp&&inp.addEventListener("input",tot);
  m.addEventListener("click",e=>{const d=e.target.closest("[data-d]"); if(d&&inp){inp.value=Math.min(29,Math.max(0,(parseInt(inp.value,10)||0)+(+d.dataset.d)));tot();return}
    if(e.target.closest("[data-ok]")){ let n=0; if(inp){n=parseInt(inp.value,10); if(!(n>=0&&n<=29)){inp.focus();return}} m.remove(); return res(v==="Collected"?{extra:n,total:b0+n}:true)}
    if(e.target.closest("[data-x]")){m.remove();res(false)} }); document.body.appendChild(m)})}
function notWhy(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Why couldn't you collect it?</h2><div><b>${esc(s.name)}</b><br>${esc(short(s.address))}, ${esc(s.postcode)}</div>
   <button class="btn bad" data-w="nt">No tree out</button><button class="btn bad" data-w="cf">Can't find the address</button><button class="btn bad" data-w="Tree too big">Tree too big</button>
   <div class="bar"><input id="why-other" type="text" maxlength="100" placeholder="Other reason"><button class="btn bad" data-w="Other" style="width:auto">Other</button></div>
   <button class="btn" data-w="Van full">Van full</button>
   <button class="btn ghost" data-w="">Cancel</button></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-w]"); if(!x) return; let w=x.dataset.w; m.remove();
    if(!w) return res(null); if(w==="nt") return res({v:"Missed",why:null}); if(w==="cf") return cfNote(s).then(n=>res(n===null?null:{v:"Missed",why:"Can't find address"+(n?": "+n:"")}));
    if(w==="Other"){const t=m.querySelector("#why-other").value.trim(); w=t?"Other: "+t:"Other"} res({v:"Skipped",why:w}) }); document.body.appendChild(m)})}
function cfNote(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Can't find the address</h2><div class="sub">Add a note for the office if it helps. This is optional.</div>
   <textarea id="cf-note" rows="3" autofocus maxlength="100" placeholder="e.g. No number 6, the road ends at 4" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px"></textarea>
   <div class="sub">You can add a photo next if you want.</div>
   <button class="btn" data-c="1">Continue</button><button class="btn ghost" data-c="0">Cancel</button></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-c]"); if(!x) return; const t=m.querySelector("#cf-note").value.replace(/\s+/g," ").trim().slice(0,100); m.remove(); res(x.dataset.c==="1"?t:null)}); document.body.appendChild(m)})}
function dropPick(pts,cur,title){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  const km=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
  const draw=pos=>{ const list=pts.map(p=>({p,d:pos?km(pos.lat,pos.lon,+p.lat,+p.lon):null})); if(pos) list.sort((a,b)=>a.d-b.d);
    m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(title||"Where are you unloading?")}</h2>${list.map(({p,d})=>`<button class="btn ${cur&&cur.id===p.id?"":"ghost"}" data-dp="${esc(p.id)}" style="text-align:left"><b>${esc(p.name)}</b>${d!=null?` · ${d.toFixed(1)} km`:""}<br><span style="font-weight:400;font-size:.9rem">${esc(p.address||"")}${p.postcode?", "+esc(p.postcode):""}${p.hours?" · "+esc(p.hours):""}</span></button>`).join("")}<button class="btn ghost" data-dp="">Cancel</button></div>` };
  draw(null); if(navigator.geolocation) navigator.geolocation.getCurrentPosition(g=>{ if(m.isConnected) draw({lat:g.coords.latitude,lon:g.coords.longitude}) },()=>{},{timeout:6000,maximumAge:300000});
  m.addEventListener("click",e=>{const x=e.target.closest("[data-dp]"); if(!x) return; m.remove(); res(x.dataset.dp||null)}); document.body.appendChild(m)})}
function dpOf(r){ const p=r&&r.dropPoint||{id:"hq",name:"HQ depot",address:"19-21 Sherwood Road, Bromsgrove",postcode:"B60 3DR"}; return {...p,full:`${p.address||""}${p.postcode?", "+p.postcode:""}`} }
function getPos(timeout){return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>{geoOK=true; lastPos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}; res(lastPos)},()=>res(null),{enableHighAccuracy:false,timeout:timeout||10000,maximumAge:60000}) })}
let PC=null; async function pcLookup(p){ if(!PC) PC=await fetch("postcodes.json").then(r=>r.json()); const k=String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(PC.pc[k]) return {lat:PC.pc[k][0],lon:PC.pc[k][1]}; const s=PC.sector[k.slice(0,-2)]; return s?{lat:s[0],lon:s[1]}:null }
async function rpc(fn,args){ const {data:d,error}=await sb.rpc(fn,args); if(error){ toast("No signal? Try again in a moment."); return null } return d||{} }
async function load(withPos){
  if(!teamToken){ data={error:"not_found"}; return render() }
  let p=null; if(withPos&&geoOK) p=await getPos(8000);
  const d=await rpc("team_get",{p_token:teamToken,p_lat:p?.lat??null,p_lon:p?.lon??null,p_acc:p?.acc??null});
  if(!d){ if(!data){ $("#sub").textContent=""; $("#main").innerHTML=`<div class="empty">Couldn't load your team page. Check your signal and tap Try again. If it keeps happening, call the office.</div><button class="btn" onclick="load()">Try again</button>` } return }
  data=d; token=d.run?.token||""; render() }
function phase(){ const r=data.run, lo=data.team&&data.team.loggedOffAt; if(!r) return lo&&Date.now()-new Date(lo)<12*3600e3?"done":"home";
  if(r.state==="out"&&r.mode==="live") return "live";
  if(r.state==="out") return "office";
  if(r.doneAt) return "done";
  if(r.officeClosedAt||!r.returningAt) return "home";
  if(!r.arrivedAt&&!r.unloadedAt) return "returning";
  if(!r.unloadedAt) return "unloading";
  return "choose" }
function progBlock(){ const p=data.report||{}, done=+p.eventTrees||0, left=+p.eventToGo||0, tot=done+left; if(!tot) return ""; const pc=Math.floor(done/tot*100);
  return `<div class="prog"><div class="pt">Primrose tree collection</div><div class="pb" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div><div class="pn"><span><b>${pc}%</b> collected</span><span><b>${left}</b> tree${left===1?"":"s"} to go</span></div></div>` }
function statBlock(){ const p=data.report||{}; return `<div class="stat"><div><b>${p.todayTrees||0}</b><span>Trees today</span></div><div><b>${p.todayRuns||0}</b><span>Runs today</span></div><div><b>${p.allTrees||0}</b><span>All weekend</span></div></div>` }
function render(){
  const m=$("#main"); if(!data){m.innerHTML="";return}
  if(data.error){ $("#sub").textContent=""; m.innerHTML=`<div class="empty">This link isn't valid. Ask the office for your team's link.</div>`; return }
  const t=data.team, r=data.run, ph=(view==="gohome"&&phase()==="done")?"home":phase(), call=data.office?`<a class="btn ghost" href="tel:${esc(data.office.replace(/\s/g,""))}">Call office ${esc(data.office)}</a>`:"";
  $("#title").textContent=t.name; document.title=t.name+" · Primrose Tree Run";
  if(t.paused&&ph!=="live"){ $("#sub").textContent=""; m.innerHTML=`<div class="empty">The office has paused your link. Please call them.</div><div class="bar">${call}</div>`; return }
  if(view==="summary"&&ph!=="live"){ const p=data.report||{};
    $("#sub").textContent="What we've done";
    m.innerHTML=`${statBlock()}<div class="sub">This weekend: <b>${p.allTrees||0} trees</b> on ${p.allRuns||0} runs. Everyone together: <b>${p.eventTrees||0} trees</b> collected for Primrose Hospice.</div><button class="btn ghost" data-v="home">Back</button>`; return }
  if(ph==="live"){ const j=data.jobs||[], cur=j[0], nxt=j[1];
    $("#sub").innerHTML=`Run ${r.n} · ${r.collectedTrees||0} tree${r.collectedTrees===1?"":"s"} on board${t.large?' · <span class="chip big">Large trees OK</span>':""}`;
    if(!cur){ m.innerHTML=`<div class="empty">No more collections near you right now.</div><button class="btn ghost" data-again>Check again</button><button class="full" data-full>Van full · head back to unload</button><div class="bar">${call}</div>`; return }
    const nav=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(short(cur.address)+", "+cur.postcode)}`;
    const tel=x=>x.phone?` · <a class="tel" href="tel:${esc(String(x.phone).replace(/\s/g,""))}">${esc(x.phone)}</a>`:"";
    m.innerHTML=`<div class="job"><div class="clbl">Collection${cur.rebooked?' <span class="chip">2nd visit</span>':""}${cur.large?' <span class="chip big">Large tree</span>':""}</div>
      <div class="q1">${cur.trees} tree${cur.trees>1?"s":""} · ${esc(cur.name)}${tel(cur)}</div>
      <div class="ad1">${esc(short(cur.address))}, ${esc(cur.postcode)}</div>
      <div class="in1">Info: ${esc(cur.where)}</div>
      <a class="btn navb" href="${nav}" target="_blank" rel="noopener">Navigate</a>
      <div class="acts"><button class="got" data-mk="Collected">Collected</button><button class="miss" data-mk="Not">Not collected</button></div></div>
      <button class="full" data-full>Van full · head back to unload</button>
      ${nxt?`<div class="nxt"><div class="clbl">Next collection</div><div class="q2">${nxt.trees} tree${nxt.trees>1?"s":""} · ${esc(nxt.name)}${tel(nxt)}</div><div>${esc(short(nxt.address))}, ${esc(nxt.postcode)}</div><div style="color:var(--muted)">Info: ${esc(nxt.where)}</div></div>`:""}
      <div class="bar">${call}</div>`; return }
  if(ph==="office"){ $("#sub").textContent=`Run ${r.n} from the office`;
    m.innerHTML=`<div class="endp"><h2>You have a run from the office</h2><div class="sub">Open it to see your stops.</div><a class="btn" href="driver.html#${esc(r.token)}">Open run ${r.n}</a></div>`; return }
  if(ph==="returning"){ $("#sub").textContent=`Run ${r.n} · ${r.collectedTrees||0} trees on board`;
    const dp=dpOf(r);
    m.innerHTML=`<div class="endp"><h2>Heading back to unload</h2><div class="clbl">Drop-off point</div><div class="q1">${esc(dp.name)}</div><div class="ad1">${esc(dp.full)}</div>${dp.hours||dp.notes?`<div class="in1">${esc([dp.hours,dp.notes].filter(Boolean).join(" · "))}</div>`:""}
      <a class="btn navb" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dp.full)}" target="_blank" rel="noopener">Route to ${esc(dp.name)}</a><button class="btn blue" data-st="driver_arrived">Arrived at ${esc(dp.name)}</button>${(data.dropPoints||[]).length>1?`<button class="btn ghost" data-chdrop>Change drop-off point</button>`:""}</div><div class="bar">${call}</div>`; return }
  if(ph==="unloading"){ $("#sub").textContent=`Run ${r.n}`;
    m.innerHTML=`<div class="endp"><h2>Unloading at ${esc(dpOf(r).name)}</h2><div class="sub">Unload your ${r.collectedTrees||0} tree${r.collectedTrees===1?"":"s"} where you're shown. Tap the button once the van is empty.</div><button class="btn blue" data-st="driver_unloaded">Unloaded</button></div><div class="bar">${call}</div>`; return }
  if(ph==="choose"){ $("#sub").textContent=`Run ${r.n} done`;
    m.innerHTML=`<div class="endp"><h2>Unloaded. Thank you!</h2><div class="sub">Run ${r.n}: ${r.collectedTrees||0} tree${r.collectedTrees===1?"":"s"} collected. Ready for more?</div>
      ${data.selfService?`<button class="btn bigbtn" data-start>Start another run</button>`:`<div class="sub">Call the office if you'd like another run.</div>`}
      <button class="btn blue" data-st="driver_done">We're done for the day</button></div>${statBlock()}<div class="bar">${call}</div>`; return }
  if(ph==="done"){ const p=data.report||{}; $("#sub").textContent="";
    m.innerHTML=`<div class="thanks"><h2>Thank you, ${esc(t.name)}!</h2><div class="tl">Today your team collected</div><div class="bigno">${p.todayTrees||0}</div><div class="tl">Christmas trees for Primrose Hospice</div>
      <div class="sm">${p.todayRuns||0} run${p.todayRuns===1?"":"s"} · ${p.todayStops||0} house${p.todayStops===1?"":"s"}</div>
      ${p.allTrees>p.todayTrees?`<div class="sm">This weekend so far: <b>${p.allTrees} trees</b> on ${p.allRuns} runs</div>`:""}
      ${p.eventTrees?`<div class="sm">Everyone together: <b>${p.eventTrees} trees</b> collected so far</div>`:""}
      <div class="sm">Every tree you collected helps pay for care at Primrose Hospice. We couldn't do it without you. Have a well-earned rest!</div></div>
      <button class="btn ghost" data-v="gohome">Home page</button>`; return }
  // home
  $("#sub").textContent=t.large?"Your team can take large trees":"Primrose Hospice Christmas Tree Collection";
  m.innerHTML=`<div class="home">${progBlock()}${data.selfService?`<button class="btn bigbtn" data-start>Lets go get some Trees!</button>`:`<div class="empty">The office will send your runs. Keep this page for your summary.</div>`}
    <button class="btn ghost" data-v="summary">What we've done</button><button class="btn blue" data-logoff>We're done for the day</button>${statBlock()}<div class="sub">You'll get one collection at a time. Mark it, and the next one appears. When the van's full, tap <b>Van full</b> and head back.</div><div class="bar">${call}</div></div>`;
}
function whereStart(){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Where are you starting from?</h2><div class="sub">We'll send you somewhere no other team is working.</div>
   <button class="btn" data-w="gps">Use my location</button><button class="btn ghost" data-w="depot">${(data.dropPoints||[]).length>1?"We're at a drop-off point":"We're at the depot"}</button>
   <div class="bar"><input class="pcin" id="pc" placeholder="Or enter a postcode" autocomplete="postal-code"><button class="btn" data-w="pc" style="width:auto">Go</button></div>
   <div class="sub" id="ws"></div><button class="btn ghost" data-w="x">Cancel</button></div>`;
  m.addEventListener("click",async e=>{const b=e.target.closest("[data-w]"); if(!b) return; const w=b.dataset.w; const st=m.querySelector("#ws");
    if(w==="x"){m.remove();return res(undefined)}
    if(w==="depot"){ m.remove(); const pts=data.dropPoints||[]; if(pts.length<2) return res(null); const id=await dropPick(pts,null,"Which drop-off point are you at?"); if(!id) return res(undefined); const p=pts.find(x=>x.id===id); return res(id==="hq"||!p?null:{lat:+p.lat,lon:+p.lon}) }
    if(w==="gps"){st.textContent="Finding you…"; const p=await getPos(12000); if(!p){st.textContent="Couldn't get your location. Allow location for this page, or tap We're at the depot.";return} m.remove(); return res(p)}
    if(w==="pc"){const v=m.querySelector("#pc").value.trim(); if(!v){st.textContent="Enter a postcode";return} st.textContent="Looking up…"; let p=null; try{p=await pcLookup(v)}catch(_){} if(!p){st.textContent="Postcode not found. Check it, or use your location.";return} m.remove(); return res(p)} });
  document.body.appendChild(m)})}
document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-v]"); if(v){view=v.dataset.v;render();window.scrollTo(0,0);return}
  if(busy) return;
  const st=e.target.closest("[data-start]");
  if(st){ const p=await whereStart(); if(p===undefined) return; busy=true; st.disabled=true; st.textContent="Finding your first collection…";
    const res=await rpc("team_start",{p_token:teamToken,p_lat:p?.lat??null,p_lon:p?.lon??null,p_acc:p?.acc??null}); busy=false;
    if(res&&res.error) toast(res.error==="none_left"?"There are no collections waiting. Thank you!":res.error==="paused"?"The office has paused your link.":res.error==="switched_off"?"The office will send your runs.":"Couldn't start a run. Call the office.");
    view="home"; await load(); window.scrollTo(0,0); return }
  if(e.target.closest("button[data-cx]")){ pend=null; render(); return }
  if(e.target.closest("button[data-xtr]")){ pend=null; const cur=(data.jobs||[])[0]; if(!cur) return; const n=await treesAsk(cur); if(!n) return; if(!await confirmAct(cur,"Extra",null,n)) return; busy=true;
    const res=await rpc("driver_trees",{p_token:token,p_ref:cur.ref,p_trees:n}); busy=false;
    if(!res){render();return} if(res.error){toast(res.error==="moved"?"The office has moved this one. Getting your next job.":"Couldn't save.");await load();return}
    toast(`Collected ${n} tree${n===1?"":"s"}`); let p=null; if(geoOK) p=await getPos(6000);
    await rpc("team_fill",{p_token:teamToken,p_lat:p?.lat??null,p_lon:p?.lon??null}); await load(); window.scrollTo(0,0); return }
  const mk=e.target.closest("button[data-mk]");
  if(mk){ const cur=(data.jobs||[])[0]; if(!cur) return; const v2=mk.dataset.mk;
    let v=v2, why=null, total=0;
    if(v2==="Not"){ const nw=await notWhy(cur); if(!nw) return; v=nw.v; why=nw.why; if(!await confirmAct(cur,v,why)) return }
    else { const r=await confirmAct(cur,"Collected"); if(!r) return; if(r.extra>0) total=r.total }
    busy=true; mk.disabled=true;
    const res=total?await rpc("driver_trees",{p_token:token,p_ref:cur.ref,p_trees:total}):await rpc("driver_set",{p_token:token,p_ref:cur.ref,p_status:v,p_reason:why}); busy=false;
    if(!res){render();return} if(res.error){toast(res.error==="moved"?"The office has moved this one. Getting your next job.":"Couldn't save.");await load();return}
    const got=total||cur.trees; toast(v==="Collected"?`Collected ${got} tree${got>1?"s":""}`:v==="Skipped"?"Not collected: back on the list":why==="Can't find address"?"Sent to the office to check":"Marked not collected");
    if(v==="Missed"||why==="Tree too big") await photoStep(cur,v==="Missed"?(String(why||"").startsWith("Can't find")?"cf":"missed"):"toobig");
    if(why==="Van full"){ await rpc("team_vanfull",{p_token:teamToken}); toast("Drive safely back to the depot"); await load(); window.scrollTo(0,0); return }
    let p=null; if(geoOK) p=await getPos(6000);
    await rpc("team_fill",{p_token:teamToken,p_lat:p?.lat??null,p_lon:p?.lon??null}); await load(); window.scrollTo(0,0); return }
  if(e.target.closest("[data-again]")){ await rpc("team_fill",{p_token:teamToken}); await load(); return }
  if(e.target.closest("[data-logoff]")){ if(!await ask("Done for the day?","The office will see your team as logged off. You can still start another run later from the Home page.","Done for the day")) return;
    busy=true; const res=await rpc("team_logoff",{p_token:teamToken}); busy=false;
    if(res&&res.error) toast(res.error==="on_run"?"Finish your run first":"Couldn't save. Try again."); view="home"; await load(); window.scrollTo(0,0); return }
  if(e.target.closest("button[data-chdrop]")){ const id=await dropPick(data.dropPoints||[],data.run&&data.run.dropPoint); if(!id) return; busy=true; const res=await rpc("driver_set_drop",{p_token:token,p_id:id}); busy=false; if(res&&res.error) toast("Couldn't change it. Try again."); else if(res) toast(`Unloading at ${res.dropPoint.name}`); await load(); return }
  const fu=e.target.closest("[data-full]");
  if(fu){ if(!await ask("Van full?","Any collections you haven't done go back on the list for other teams. Then head back to the depot to unload.","Van full")) return;
    busy=true; fu.disabled=true; const res=await rpc("team_vanfull",{p_token:teamToken}); busy=false;
    if(res&&res.error==="not_finished") toast("Mark the current collection first"); else if(res) toast("Drive safely back to the depot"); await load(); window.scrollTo(0,0); return }
  const s2=e.target.closest("[data-st]");
  if(s2){ busy=true; s2.disabled=true; const res=await rpc(s2.dataset.st,{p_token:token}); busy=false; if(res&&res.error) toast("Couldn't save. Try again."); await load(); window.scrollTo(0,0); return }
});
load(); setInterval(()=>load(true),60000); document.addEventListener("visibilitychange",()=>{if(!document.hidden) load(true)});
</script></body></html>
