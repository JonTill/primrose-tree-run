<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00905e"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Primrose Tree Run · Team</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>

:root{--bg:#f3f7f5;--surface:#fff;--fg:#1d2a26;--muted:#6a6d71;--line:#d5e0db;--green:#00905e;--yellow:#ffde0e;--blue:#00587B;--bad:#b3261e;--bad-soft:#fbe3e1;--ok-soft:#dcf1e6;--skip:#8a5a00;--skip-soft:#fff3d6;
--display:"Nunito","Trebuchet MS",Arial,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--surface:#172420;--fg:#e8f0ec;--muted:#a9b4b0;--line:#2a3a35;--green:#3fc08f;--blue:#81b8da;--bad:#ff8a80;--bad-soft:#3d1a18;--ok-soft:#173a2b;--skip:#f0b44c;--skip-soft:#3a2c10;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{border-bottom:5px solid var(--yellow);padding-bottom:10px}
.logo{display:inline-block;background:#fff;border-radius:8px;padding:5px 7px;line-height:0}.logo img{height:40px}
h1{font:900 1.5rem/1.1 var(--display);color:var(--blue);margin:8px 0 2px}
.sub{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 1rem var(--body);padding:13px 14px;border-radius:12px;border:1px solid var(--green);background:var(--green);color:#fff;text-decoration:none;text-align:center;cursor:pointer;flex:1 1 auto}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.prog{font-weight:700}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stop.m{border-color:var(--bad);background:var(--bad-soft)}.stop.d{opacity:.55}
.top{display:flex;gap:12px;align-items:flex-start}
.n{font:900 1.5rem var(--display);width:1.6em;text-align:center;flex:none}
.body{flex:1;min-width:0}.name{font-weight:700}.info{font-size:.9rem;color:var(--muted)}.info b{color:var(--fg)}
.trees{font:900 1.5rem var(--display);text-align:right;line-height:1}.trees small{display:block;font:600 .65rem var(--body);color:var(--muted);text-transform:uppercase}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel{outline:4px solid var(--blue);outline-offset:2px}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.badl{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.cfmrow{display:grid;grid-template-columns:2fr 1fr;gap:8px;grid-column:1/-1}.cfmrow .btn{font-size:1.05rem;padding:14px}
.xtr{font:800 1rem var(--body);padding:14px 6px;border-radius:12px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);cursor:pointer}
.miss{font:800 1rem var(--body);padding:14px 6px;border-radius:12px;border:2px solid var(--bad);background:var(--surface);color:var(--bad);cursor:pointer}
.miss.on{background:var(--bad);color:#fff}
.got{font:800 1rem var(--body);padding:14px 6px;border-radius:12px;border:2px solid var(--green);background:var(--surface);color:var(--green);cursor:pointer}
.got.on{background:var(--green);color:#fff}
.stop.s{border-color:var(--skip);background:var(--skip-soft)}
.chip.big{background:var(--blue);color:#fff}
.box .btn{width:100%}
#why-other{flex:1 1 160px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.nav{grid-column:1/-1}
.clbl{font:800 .9rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--green)}.clbl .chip{text-transform:none;letter-spacing:0;vertical-align:1px}
.q1{font:900 1.12rem/1.25 var(--display);overflow-wrap:anywhere}.ad1{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}.in1{font-size:1.05rem;font-weight:600}
.tel{color:var(--blue);font-weight:800;text-decoration:none;white-space:nowrap}.btn.navb{background:var(--blue);border-color:var(--blue);color:#fff}
.nxt{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}.nxt .clbl{color:var(--muted);font-size:.75rem}.nxt .q2{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}

.stop.c{border-color:var(--green);background:var(--ok-soft)}
.done{font:900 1.15rem var(--display);padding:18px;border-radius:14px;border:0;background:var(--blue);color:#fff;cursor:pointer;width:100%}
.done:disabled{background:var(--line);color:var(--muted);cursor:default}
.phok{font-size:.85rem;font-weight:700;color:var(--green)}
.addph{font:700 .95rem var(--body);padding:10px;border-radius:12px;border:2px dashed var(--bad);background:var(--surface);color:var(--bad);cursor:pointer;grid-column:1/-1}
.camlab{display:block;position:relative;overflow:hidden}.camlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.endp{background:var(--surface);border:2px solid var(--blue);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.endp h2{font:900 1.3rem var(--display);margin:0;color:var(--blue)}
.endp .btn{font-size:1.05rem;padding:16px}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.thanks{background:var(--yellow);color:#1d2a26;border-radius:18px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.thanks h2{font:900 2rem/1.1 var(--display);margin:0;color:#00587B}
.thanks .big{font:900 4rem/1 var(--display);color:#00905e}
.thanks .lbl{font-weight:700;font-size:1.05rem}
.thanks .sm{font-size:.95rem}
.num{display:flex;gap:8px;align-items:center;justify-content:center}.num input{width:96px;text-align:center;font:900 2rem var(--display);padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.num button{font:900 1.6rem var(--display);width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip.ex{background:var(--blue);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.box h2{font:900 1.3rem var(--display);margin:0;color:var(--blue)}
button:disabled{opacity:.6}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--yellow);color:#1d2a26}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.job{background:var(--surface);border:2px solid var(--green);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.job+.full{margin-top:10px}.full+.nxt{margin-top:10px}
.next{font-size:.92rem;color:var(--muted);padding:2px 4px}
.next b{color:var(--fg)}
.home{display:flex;flex-direction:column;gap:12px}
.bigbtn{font:900 1.25rem var(--display);padding:20px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.prog .pt{font:800 .8rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.prog .pb{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.prog .pb i{display:block;height:100%;background:var(--green);border-radius:7px}.prog .pn{display:flex;justify-content:space-between;font-size:1.05rem}.prog .pn b{font-size:1.3rem}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:900 1.6rem var(--display);color:var(--blue)}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:700}
.full{font:900 1.05rem var(--display);padding:16px;border-radius:14px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);cursor:pointer;width:100%}
.pcin{flex:1 1 140px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-transform:uppercase}
.thanks{background:var(--yellow);color:#1d2a26;border-radius:18px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.thanks h2{font:900 2rem/1.1 var(--display);margin:0;color:#00587B}
.thanks .bigno{font:900 4rem/1 var(--display);color:#00905e}
.thanks .tl{font-weight:700;font-size:1.05rem}
.endp{background:var(--surface);border:2px solid var(--blue);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.endp h2{font:900 1.3rem var(--display);margin:0;color:var(--blue)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
</style></head><body>

  <h1 id="title">Christmas Tree Collection</h1><div class="sub" id="sub">Loading…</div></header>
  <div id="main"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const cfg=window.TREERUN_CONFIG, sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:false}});
const teamToken=(location.hash||"").replace(/^#/,"").trim();
window.addEventListener("hashchange",()=>location.reload());
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=a=>String(a||"").replace(/, Worcestershire$/,"");
let data=null, busy=false, token="", geoOK=false, lastPos=null, view="home", pend=null;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function ask(title,text,ok){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div>${esc(text)}</div><div class="bar"><button class="btn ghost" data-x="0">Cancel</button><button class="btn" data-x="1" style="background:var(--blue);border-color:var(--blue)">${esc(ok)}</button></div></div>`;
  m.addEventListener("click",e=>{const x=e.target.closest("[data-x]"); if(!x&&e.target!==m) return; m.remove(); res(x?.dataset.x==="1")}); document.body.appendChild(m)})}
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);let out=c.toDataURL("image/jpeg",q);for(let qq=q-.1;out.length>650000&&qq>.2;qq-=.1) out=c.toDataURL("image/jpeg",qq);res(out)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"))};i.src=u})}
function photoStep(s,kind){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${kind==="toobig"?"Take a photo of the tree":kind==="cf"?"Add a photo (optional)":"Take a photo of the house"}</h2><div class="sub">${kind==="toobig"?"So the office can see how big it is.":kind==="cf"?"Of the street or where you looked, so the office can see.":"Front of the house or the drive, showing there's no tree out."}</div>
   <label class="btn camlab">Take photo<input type="file" accept="image/*" capture="environment"></label><div class="sub" data-st hidden>Uploading photo…</div>
   <button class="btn ghost" data-np>${kind==="cf"?"Skip":"No photo"}</button></div>`;
  const fin=async img=>{ m.querySelectorAll("button,input").forEach(x=>x.disabled=true);
    let thumb=null; if(img){ m.querySelector("[data-st]").hidden=false; try{ thumb=await shrink(img,240,.6); img=await shrink(img,1280,.6) }catch(e){ toast("Couldn't read that photo. Try again."); m.querySelectorAll("button,input").forEach(x=>x.disabled=false); m.querySelector("[data-st]").hidden=true; return } }
    const {data:r,error}=await sb.rpc("driver_photo",{p_token:token,p_ref:s.ref,p_kind:kind==="cf"?"missed":kind,p_img:img,p_thumb:thumb});
    if(img&&(error||r?.error)){ toast(error?"Photo didn't send. Check signal. You can tap Add photo later.":"Couldn't save the photo."); m.remove(); return res(false) }
    m.remove(); if(img){ s.photo=true; toast("Photo added") } res(!!img) };
  m.querySelector("input").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0]; if(f) fin(f)});
  m.querySelector("[data-np]").addEventListener("click",()=>fin(null));
  document.body.appendChild(m)})}
function treesAsk(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal"; const b0=s.booked||s.trees||1;
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Collected + Extra</h2><div class="sub">${esc(s.name)}: booked ${b0} tree${b0===1?"":"s"}. How many extra trees are you taking?</div>
   <div class="num"><button data-d="-1" aria-label="One fewer">−</button><input id="tq" type="number" inputmode="numeric" min="1" max="29" value="1"><button data-d="1" aria-label="One more">+</button></div>
   <div class="sub" id="tqt" style="text-align:center"></div>
   <button class="btn" data-ok>Next</button><button class="btn ghost" data-x>Cancel</button></div>`;
  const inp=m.querySelector("#tq"), tot=()=>{const v=parseInt(inp.value,10)||0; m.querySelector("#tqt").innerHTML=`Total collected here: <b>${b0+v}</b>`}; tot(); inp.addEventListener("input",tot);
  m.addEventListener("click",e=>{const d=e.target.closest("[data-d]"); if(d){inp.value=Math.min(29,Math.max(1,(parseInt(inp.value,10)||1)+(+d.dataset.d)));tot();return}
    if(e.target.closest("[data-ok]")){const v=parseInt(inp.value,10); if(!(v>=1&&v<=29)){inp.focus();return} m.remove(); return res(b0+v)}
    if(e.target.closest("[data-x]")){m.remove(); res(null)} }); document.body.appendChild(m)})}
function confirmAct(s,v,why){return new Promise(res=>{const m=document.createElement("div");m.className="modal"; const b0=s.booked||s.trees||1, cf=String(why||"").startsWith("Can't find address"), cfn=cf?String(why).replace(/^Can't find address:?\s*/,""):"";
  const t=v==="Collected"?"Confirm collected":v==="out"?"Undo this stop?":cf?"Can't find the address":"Confirm not collected";
  const line=v==="Collected"?`Booked: <b>${b0}</b> tree${b0===1?"":"s"}. Any extra trees here?</div>
   <div class="num"><button data-d="-1" aria-label="One fewer">−</button><input id="tq" type="number" inputmode="numeric" min="0" max="29" value="0"><button data-d="1" aria-label="One more">+</button></div>
   <div class="sub" id="tqt" style="text-align:center;font-size:1rem">`:v==="Missed"?(cf?`Reason: <b>Can't find the address</b>.${cfn?` Note: <b>${esc(cfn)}</b>.`:""} The office will check the address and contact the customer. You can add a photo next if you want.`:"Reason: <b>No tree out</b>. You'll be asked for a photo next."):v==="Skipped"?(why==="Van full"?"Reason: <b>Van full</b>. This one and any stops left on your run go back on the list for other teams. Then head back to unload.":`Reason: <b>${esc(why||"")}</b>. It goes back on the list for another team.`):"It goes back to not done.";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${t}</h2><div><b>${esc(s.name)}</b><br>${esc(short(s.address))}, ${esc(s.postcode)}</div><div class="sub" style="font-size:1rem">${line}</div>
   <button class="btn" data-ok>Confirm</button><button class="btn ghost" data-x>Cancel</button></div>`;

function cfNote(s){return new Promise(res=>{const m=document.createElement("div");m.className="modal";

function dropPick(pts,cur,title){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  const km=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
  const draw=pos=>{ const list=pts.map(p=>({p,d:pos?km(pos.lat,pos.lon,+p.lat,+p.lon):null})); if(pos) list.sort((a,b)=>a.d-b.d);
    m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(title||"Where are you unloading?")}</h2>${list.map(({p,d})=>`<button class="btn ${cur&&cur.id===p.id?"":"ghost"}" data-dp="${esc(p.id)}" style="text-align:left"><b>${esc(p.name)}</b>${d!=null?` · ${d.toFixed(1)} km`:""}<br><span style="font-weight:400;font-size:.9rem">${esc(p.address||"")}${p.postcode?", "+esc(p.postcode):""}${p.hours?" · "+esc(p.hours):""}</span></button>`).join("")}<button class="btn ghost" data-dp="">Cancel</button></div>` };
  draw(null); if(navigator.geolocation) navigator.geolocation.getCurrentPosition(g=>{ if(m.isConnected) draw({lat:g.coords.latitude,lon:g.coords.longitude}) },()=>{},{timeout:6000,maximumAge:300000});
  m.addEventListener("click",e=>{const x=e.target.closest("[data-dp]"); if(!x) return; m.remove(); res(x.dataset.dp||null)}); document.body.appendChild(m)})}
function dpOf(r){ const p=r&&r.dropPoint||(typeof data!=="undefined"&&data&&(data.dropPoints||[])[0])||{id:"hq",name:"HQ depot",address:"19-21 Sherwood Road, Bromsgrove",postcode:"B60 3DR"}; return {...p,full:`${p.address||""}${p.postcode?", "+p.postcode:""}`} } function otherDrops(dp){ const k=(a,b)=>a.lat==null||b.lat==null?0:(a.lat-b.lat)**2+((a.lon-b.lon)*0.61)**2; const o=(data.dropPoints||[]).filter(p=>p.id!==dp.id).sort((a,b)=>k(dp,a)-k(dp,b)); if(!o.length) return ""; return `<div class="clbl" style="color:var(--muted);margin-top:8px">Or unload at</div>`+o.map(p=>`<button class="btn ghost" data-setdrop="${esc(p.id)}" style="text-align:left;line-height:1.3"><b>${esc(p.name)}</b><br><span style="font-weight:400;font-size:.9rem">${esc(p.address||"")}${p.postcode?", "+esc(p.postcode):""}${p.hours?" · "+esc(p.hours):""}</span></button>`).join("") } function totLine(n){ const p=data.report||{}, a=[`This run <b>${n}</b> tree${n===1?"":"s"}`]; if((p.todayRuns||0)>1) a.push(`Today <b>${p.todayTrees||0}</b>`); if((p.allRuns||0)>(p.todayRuns||0)&&(p.allRuns||0)>1) a.push(`So far <b>${p.allTrees||0}</b>`); return a.join(" · ") }
function getPos(timeout){return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>{geoOK=true; lastPos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}; res(lastPos)},()=>res(null),{enableHighAccuracy:false,timeout:timeout||10000,maximumAge:60000}) })}
let PC=null; async function pcLookup(p){ if(!PC) PC=await fetch("postcodes.json").then(r=>r.json()); const k=String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(PC.pc[k]) return {lat:PC.pc[k][0],lon:PC.pc[k][1]}; const s=PC.sector[k.slice(0,-2)]; return s?{lat:s[0],lon:s[1]}:null }
async function rpc(fn,args){ const {data:d,error}=await sb.rpc(fn,args); if(error){ toast("No signal? Try again in a moment."); return null } return d||{} }
async function load(withPos){
  if(!teamToken){ data={error:"not_found"}; return render() }
  let p=null; if(withPos&&geoOK) p=await getPos(8000);

function phase(){ const r=data.run, lo=data.team&&data.team.loggedOffAt; if(!r) return lo&&Date.now()-new Date(lo)<12*3600e3?"done":"home";
  if(r.state==="out"&&r.mode==="live") return "live";
  if(r.state==="out") return "office";
  if(r.doneAt) return "done";
  if(r.officeClosedAt||!r.returningAt) return "home";
  if(!r.arrivedAt&&!r.unloadedAt) return "returning";
  if(!r.unloadedAt) return "unloading";
  return "choose" }
function progBlock(){ const p=data.report||{}, done=+p.eventTrees||0, left=+p.eventToGo||0, tot=done+left; if(!tot) return ""; const pc=Math.floor(done/tot*100);

function statBlock(){ const p=data.report||{}; return `<div class="stat"><div><b>${p.todayTrees||0}</b><span>Trees today</span></div><div><b>${p.todayRuns||0}</b><span>Runs today</span></div><div><b>${p.allTrees||0}</b><span>All weekend</span></div></div>` }

      ${nxt?`<div class="nxt"><div class="clbl">Next collection</div><div class="q2">${nxt.trees} tree${nxt.trees>1?"s":""} · ${esc(nxt.name)}${tel(nxt)}</div><div>${esc(short(nxt.address))}, ${esc(nxt.postcode)}</div><div style="color:var(--muted)">Info: ${esc(nxt.where)}</div></div>`:""}
      <div class="bar">${call}</div>`; return }
  if(ph==="office"){ $("#sub").textContent=`Run ${r.n} from the office`;
    m.innerHTML=`<div class="endp"><h2>You have a run from the office</h2><div class="sub">Open it to see your stops.</div><a class="btn" href="driver.html#${esc(r.token)}">Open run ${r.n}</a></div>`; return }

  if(ph==="unloading"){ $("#sub").textContent=`Run ${r.n}`;
    m.innerHTML=`<div class="endp"><h2>Unloading at ${esc(dpOf(r).name)}</h2><div class="sub">Unload your ${r.collectedTrees||0} tree${r.collectedTrees===1?"":"s"} where you're shown. Tap the button once the van is empty.</div><button class="btn blue" data-st="driver_unloaded">Unloaded</button></div><div class="bar">${call}</div>`; return }
  if(ph==="choose"){ $("#sub").textContent=`Run ${r.n} done`;
    m.innerHTML=`<div class="endp"><h2>Unloaded. Thank you!</h2><div class="sub">Run ${r.n}: ${r.collectedTrees||0} tree${r.collectedTrees===1?"":"s"} collected. Ready for more?</div>
      ${data.selfService?`<button class="btn bigbtn" data-start>Start another run</button>`:`<div class="sub">Call the office if you'd like another run.</div>`}

function whereStart(){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>Where are you starting from?</h2><div class="sub">We'll send you somewhere no other team is working.</div>
   <button class="btn" data-w="gps">Use my location</button><button class="btn ghost" data-w="depot">We're at the GTAccess depot</button>${(data.dropPoints||[]).some(p=>p.id!=="hq")?`<button class="btn ghost" data-w="drop">${(data.dropPoints||[]).length>1?"We're at a drop-off point":"We're at "+esc(data.dropPoints[0].name)}</button>`:""}

document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-v]"); if(v){view=v.dataset.v;render();window.scrollTo(0,0);return}

  if(st){ const p=await whereStart(); if(p===undefined) return; busy=true; st.disabled=true; st.textContent="Finding your first collection…";

    if(res&&res.error) toast(res.error==="none_left"?"There are no collections waiting. Thank you!":res.error==="paused"?"The office has paused your link.":res.error==="switched_off"?"The office will send your runs.":"Couldn't start a run. Call the office.");
    view="home"; await load(); window.scrollTo(0,0); return }
  if(e.target.closest("button[data-cx]")){ pend=null; render(); return }

    const res=await rpc("driver_trees",{p_token:token,p_ref:cur.ref,p_trees:n}); busy=false;

    toast(`Collected ${n} tree${n===1?"":"s"}`); let p=null; if(geoOK) p=await getPos(6000);

  const mk=e.target.closest("button[data-mk]");

    let v=v2, why=null, total=0;

    busy=true; fu.disabled=true; const res=await rpc("team_vanfull",{p_token:teamToken}); busy=false;

});
