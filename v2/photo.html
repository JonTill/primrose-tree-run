<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00905e"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Primrose Hospice TreeCycle</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="tokens.css?v=1">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding:16px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{border-bottom:5px solid var(--yellow);padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo img{height:56px;width:auto;background:#fff;border-radius:8px;padding:4px}
h1{font:900 1.5rem/1.2 var(--display);color:var(--blue);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.photo img{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:8px}
.muted{color:var(--muted);font-size:.92rem}
#st{margin-top:12px}
.note p{margin:0 0 10px}
.note.ok{background:var(--ok-soft);border-radius:10px;padding:12px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn{font:700 1rem var(--body);min-height:52px;border-radius:12px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);padding:10px 14px;cursor:pointer}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.6}
.warn{color:var(--bad);font-weight:700}
.form label{display:block;font-weight:700;margin:0 0 10px}
.form input{display:block;width:100%;font:16px var(--body);padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:var(--surface);color:var(--fg)}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}
h1,h2,h3,h4,button,.btn{text-transform:capitalize}
</style></head><body>
<div class="wrap">
  <header><div class="logo"><img src="primrose.png" alt="Primrose Hospice"><img class="tc" src="treecycle.png" alt="TreeCycle"></div><h1 id="h1">Primrose Hospice TreeCycle</h1></header>
  <div id="main" class="card">Loading…</div>
  <footer><span id="ft">Primrose Hospice TreeCycle</span> · Registered Charity No. 700272</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js?v=1"></script>
<script src="photo.js?v=1"></script>
</body></html>
